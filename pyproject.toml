[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lhco-anomaly-svdd"
version = "1.0.0"
description = "Unsupervised and semi-supervised anomaly detection benchmark on the LHC Olympics 2020 R&D dataset"
authors = [{ name = "Mithil Hardik Astik" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "h5py>=3.10,<4",
    "hdf5plugin>=6,<7",
    "tables>=3.9,<4",
    "PyYAML>=6,<7",
    "torch>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "mlflow>=2.12,<4",
    "matplotlib>=3.8,<4",
    "reportlab>=4,<6",
    "Pillow>=10,<13",
    "fastjet>=3.4,<4",
    "uproot>=5,<6",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "black>=24,<27", "flake8>=7,<8"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
pythonpath = ["."]

